# A throwaway Vault in dev mode (in-memory, root token "root", KV v2 mounted on secret/),
# to try the other examples of this directory. Never use this for anything else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.20
        args: ["server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]
        ports:
        - containerPort: 8200
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  selector:
    app: vault
  ports:
  - port: 8200
---
# The token used by the examples, as a Secret
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
stringData:
  token: root
---
# Only needed when the operator runs with networkPolicy.enabled: allow it to reach this Vault
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kuberest-to-vault
spec:
  podSelector:
    matchLabels:
      app: kuberest
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: vault
    ports:
    - port: 8200
      protocol: TCP

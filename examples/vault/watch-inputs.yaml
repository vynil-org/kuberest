# Copy a Secret into a Vault KV v2 secret and follow it as soon as it changes.
#
# `watchInputs: true` makes the controller reconcile this RestEndPoint when a Secret or ConfigMap
# listed in its `inputs` changes, so `checkFrequency` can become a slow drift check (here 1h)
# instead of the only way to notice a change.
# A Secret written by kuberest itself (an `outputs` entry) never wakes anybody up.
apiVersion: kuberest.solidite.fr/v1
kind: RestEndPoint
metadata:
  name: vault-watch
spec:
  watchInputs: true
  checkFrequency: 3600
  inputs:
  - name: token
    secretRef:
      name: vault-token
  - name: src
    secretRef:
      name: watch-src
  client:
    baseurl: http://vault:8200/v1
    headers:
      X-Vault-Token: '{{ base64_decode input.token.data.token }}'
  writes:
  - name: kv
    path: secret/data
    createMethod: Put
    updateMethod: Put
    diff: Subset
    items:
    - name: watch
      key: watch
      teardown: true
      valuesQuery: "$.data"
      readValuesQuery: "$.data.data"
      values: |
        data:
        {{#each input.src.data}}
          {{@key}}: {{{ json_to_str (base64_decode this) }}}
        {{/each}}

name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Setup qemu for multi-arch support
      - name: Docker Setup qemu-action
        uses: docker/setup-qemu-action@v3
      # Build and push with docker buildx
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure tags based on git tags + latest
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kuberest
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Docker login on main origin
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Persist base image build to a tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/kuberest:e2e
          cache-from: type=gha,scope=base
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload base docker image as artifact for e2e tests
        uses: actions/upload-artifact@v4
        with:
          name: controller-image
          path: /tmp/image.tar

  otel-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Setup qemu for multi-arch support
      - name: Docker Setup qemu-action
        uses: docker/setup-qemu-action@v2
      # Build and push with docker buildx
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure tags based on git tags + latest
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kuberest
          tags: |
            type=semver,pattern={{version}},prefix=otel-
            type=semver,pattern={{major}}.{{minor}},prefix=otel-
            type=raw,value=otel-latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Docker login on main origin
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=otel
          cache-to: type=gha,scope=otel,mode=max
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            FEATURES=--features=telemetry

  e2e:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: nolar/setup-k3d-k3s@v1
        with:
          version: v1.30
          k3d-name: kube
          k3d-args: "--no-lb --no-rollback --k3s-arg --disable=traefik,servicelb,metrics-server@server:*"
      - run: kubectl apply -k deploy/crd
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Download docker image artifact from docker job
        uses: actions/download-artifact@v4
        with:
          name: controller-image
          path: /tmp
      # The k3d nodes have their own containerd: a plain `docker load` on the
      # runner is invisible to them, the image has to be imported in the cluster.
      - name: Import docker image tarball into k3d
        run: k3d image import /tmp/image.tar -c kube
      - name: helm template | kubctl apply
        run: |
          apiserver="$(kubectl get endpoints kubernetes -ojson | jq '.subsets[0].addresses[0].ip' -r)"
          helm template charts/kuberest \
            --set version=e2e \
            --set networkPolicy.enabled=true \
            --set networkPolicy.apiserver.0=${apiserver}/32 \
            | kubectl apply -f -
      - run: kubectl wait --for=condition=available deploy/kuberest --timeout=120s
      - name: Dump controller state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deploy/kuberest
          kubectl describe pods -l app=kuberest
          kubectl logs deploy/kuberest --all-containers --previous || true
          kubectl logs deploy/kuberest --all-containers || true
          kubectl get events --sort-by=.lastTimestamp
      - run: kubectl apply -f examples/abuses/uuidgen.yaml
      - run: kubectl wait --for=condition=ready rep/uuidgen
      # verify reconcile actions have happened
      - run: kubectl logs deploy/kuberest
      - run: kubectl get event --field-selector "involvedObject.kind=RestEndPoint,involvedObject.name=uuidgen" | grep "IgnoredInput"
      - run: kubectl get secrets output
      - run: kubectl get rep -oyaml | grep -A1 finalizers | grep restendpoints.kuberest.solidite.fr
      # Exercise the RestClient path (HTTP call to the controller's own /health):
      # it panics at the first request if vynil_core::set_client_name was not called.
      - run: kubectl apply -f examples/abuses/self-health.yaml
      - run: kubectl wait --for=condition=ready rep/self-health --timeout=60s
      - run: kubectl get cm self-health -ojsonpath='{.data.health}' | grep healthy
      # Regression for issue #15: adding a new key to outputs[].data must not panic
      - run: kubectl apply -f examples/abuses/output-new-key.yaml
      - run: kubectl wait --for=condition=ready rep/output-new-key --timeout=60s
      - run: kubectl apply -f examples/abuses/output-new-key-updated.yaml
      - run: kubectl wait --for=jsonpath='{.data.b}'=Mg== secret/output-new-key --timeout=60s
      - run: kubectl wait --for=jsonpath='{.data.b}'=2 cm/output-new-key --timeout=60s
      # the controller must still be alive (no CrashLoopBackOff)
      - name: Controller did not restart
        run: |
          sleep 20
          restarts="$(kubectl get pods -l app=kuberest -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}')"
          echo "restarts: ${restarts}"
          for r in ${restarts}; do test "$r" = "0"; done
      # Vault (examples/vault): a real Vault in dev mode, token authentication
      - run: kubectl apply -f examples/vault/dev-vault.yaml
      - run: kubectl wait --for=condition=available deploy/vault --timeout=120s
      - name: Vault, Kubernetes -> Vault (static key, diff before update)
        env:
          VAULT: kubectl exec deploy/vault -- env VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault
        run: |
          set -eu
          # wait until the controller has reconciled the current generation of the rep
          reconciled() {
            for i in $(seq 1 60); do
              g=$(kubectl get rep vault-write-kv -o jsonpath='{.metadata.generation}')
              [ "$(kubectl get rep vault-write-kv -o jsonpath='{.status.generation}')" = "$g" ] && return 0
              sleep 2
            done
            echo "vault-write-kv not reconciled"; return 1
          }
          kubectl create secret generic app-secret --from-literal=password=v1 --from-literal=user=alice
          kubectl apply -f examples/vault/write-kv.yaml
          kubectl wait --for=condition=ready rep/vault-write-kv --timeout=60s
          test "$($VAULT kv get -field=password secret/app)" = "v1"
          test "$($VAULT kv metadata get -format=json secret/app | jq .data.current_version)" = "1"
          # reconcile again without any change (a new generation forces it): no new KV version
          for n in 61 62 63; do
            kubectl patch rep vault-write-kv --type=merge -p "{\"spec\":{\"checkFrequency\":$n}}"
            reconciled
          done
          test "$($VAULT kv metadata get -format=json secret/app | jq .data.current_version)" = "1"
          # a changed Secret is written: version 2
          kubectl create secret generic app-secret --from-literal=password=v2 --from-literal=user=alice --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch rep vault-write-kv --type=merge -p '{"spec":{"checkFrequency":64}}'
          for i in $(seq 1 30); do
            [ "$($VAULT kv get -field=password secret/app)" = "v2" ] && break
            sleep 2
          done
          test "$($VAULT kv get -field=password secret/app)" = "v2"
          test "$($VAULT kv metadata get -format=json secret/app | jq .data.current_version)" = "2"
          # a manual drift is corrected: the Secret's value is written back
          $VAULT kv put secret/app password=HACKED user=alice
          kubectl patch rep vault-write-kv --type=merge -p '{"spec":{"checkFrequency":65}}'
          for i in $(seq 1 30); do
            [ "$($VAULT kv get -field=password secret/app)" = "v2" ] && break
            sleep 2
          done
          test "$($VAULT kv get -field=password secret/app)" = "v2"
      - name: Vault, Vault -> Kubernetes (read) and teardown
        env:
          VAULT: kubectl exec deploy/vault -- env VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault
        run: |
          set -eu
          $VAULT kv put secret/from-vault password=s3cr3t
          kubectl apply -f examples/vault/read-kv.yaml
          kubectl wait --for=condition=ready rep/vault-read-kv --timeout=60s
          test "$(kubectl get secret from-vault -ojsonpath='{.data.password}' | base64 -d)" = "s3cr3t"
          # a read with POST (read_method: Post): a value from a POST that stores nothing
          kubectl apply -f examples/vault/read-post.yaml
          kubectl wait --for=condition=ready rep/vault-read-post --timeout=60s
          test -n "$(kubectl get secret vault-random -ojsonpath='{.data.random}' | base64 -d)"
          # the key of a write is kept when the post script fails (#31)
          kubectl apply -f examples/abuses/post-fails-keeps-keys.yaml
          for i in $(seq 1 30); do
            [ "$(kubectl get rep vault-post-fails -o jsonpath='{.status.ownedTarget[0].key}')" = "keep" ] && break
            sleep 2
          done
          test "$(kubectl get rep vault-post-fails -o jsonpath='{.status.ownedTarget[0].key}')" = "keep"
          kubectl delete rep vault-post-fails --timeout=60s
          # teardown deletes what the RestEndPoint wrote
          kubectl delete rep vault-write-kv --timeout=60s
          if $VAULT kv get -field=password secret/app; then echo "secret/app still readable"; exit 1; fi
      - name: Dump the Vault e2e state on failure
        if: failure()
        run: |
          kubectl get rep -o yaml
          kubectl logs deploy/kuberest --all-containers --tail=80 || true
          kubectl get events --sort-by=.lastTimestamp | tail -30
          kubectl get networkpolicy -o yaml
      # TODO: add more e2e tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt,clippy
      - run: cargo +nightly fmt -- --check

      - uses: giraffate/clippy-action@v1
        with:
          reporter: 'github-pr-review'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clippy_flags: --all-features

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: nolar/setup-k3d-k3s@v1
        with:
          version: v1.30
          k3d-name: kube
          k3d-args: "--no-lb --no-rollback --k3s-arg --disable=traefik,servicelb,metrics-server@server:*"

      - name: Build workspace
        run: cargo build
      - name: Install crd
        run: cargo run --bin crdgen | kubectl apply -f -
      - name: Run all default features integration library tests
        run: cargo test --lib --all -- --ignored

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # deploy/operator/deployment.yaml is rendered with this exact helm version: the blank
      # lines between documents differ from one helm release to another.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.0

      # Real CI work starts here
      - name: Build workspace
        run: cargo build
      - name: Generate crd.yaml
        run: cargo run --bin crdgen > deploy/crd/crd.yaml
      - name: Generate deployment.yaml
        run: helm template charts/kuberest > deploy/operator/deployment.yaml
      - name: Ensure generated output is committed
        run: |
          if ! git diff --exit-code deploy/; then
              echo "Uncommitted changes in yaml directory"
              echo "Please run 'cargo cmd generate' and commit the results"
              exit 1
          fi
      - name: Run workspace unit tests
        run: cargo test

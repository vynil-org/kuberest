apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: restendpoints.kuberest.solidite.fr
spec:
  group: kuberest.solidite.fr
  names:
    categories: []
    kind: RestEndPoint
    plural: restendpoints
    shortNames:
    - rep
    singular: restendpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Base URL
      jsonPath: .spec.client.baseurl
      name: baseurl
      type: string
    - description: Last update date
      format: date-time
      jsonPath: .status.conditions[?(@.type == 'Ready')].lastTransitionTime
      name: last_updated
      type: date
    - description: Errors
      jsonPath: .status.conditions[?(@.status == 'False')].message
      name: errors
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: Custom resource representing a RestEndPoint for kuberest
        properties:
          spec:
            description: Describe the specification of a RestEndPoint
            properties:
              checkFrequency:
                description: 'checkFrequency define the pooling interval (in seconds, default: 3600 aka 1h)'
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              client:
                description: Define the how the client should connect to the API endpoint(s)
                properties:
                  baseurl:
                    description: The baseurl the client will use. All path will use this as a prefix
                    type: string
                  childrenNoSubKey:
                    description: 'If true, updates and deletes use the same path as create and include the primary key in the payload (default: false)'
                    nullable: true
                    type: boolean
                  clientCert:
                    description: mTLS client certificate
                    nullable: true
                    type: string
                  clientKey:
                    description: mTLS client key
                    nullable: true
                    type: string
                  createMethod:
                    description: Create verbs accepted by [`RestClient::obj_create`].
                    enum:
                    - Post
                    - Put
                    nullable: true
                    type: string
                  deleteMethod:
                    description: Delete verbs accepted by [`RestClient::obj_delete`].
                    enum:
                    - Delete
                    nullable: true
                    type: string
                  headers:
                    additionalProperties:
                      type: string
                    description: Headers to use on each requests to the endpoint
                    nullable: true
                    type: object
                  keyIsPath:
                    description: 'If true, the key returned by the API is a full path (href) used as is, relative to the baseurl, for updates, deletes and tasks (default: false)'
                    nullable: true
                    type: boolean
                  keyName:
                    description: 'keyName: the key of the object (default: id)'
                    nullable: true
                    type: string
                  readMethod:
                    description: Read verb accepted by [`RestClient::obj_read`].
                    enum:
                    - Get
                    - Post
                    nullable: true
                    type: string
                  serverCa:
                    description: For self-signed Certificates on the destination endpoint
                    nullable: true
                    type: string
                  teardown:
                    description: 'Delete the Objects on RestEndPoint deletion (default: true, inability to do so will block RestEndPoint)'
                    nullable: true
                    type: boolean
                  updateMethod:
                    description: Update verbs accepted by [`RestClient::obj_update`].
                    enum:
                    - Patch
                    - Put
                    - Post
                    - None
                    nullable: true
                    type: string
                required:
                - baseurl
                type: object
              init:
                description: A rhai pre-script to setup some complex variables before client setup
                nullable: true
                type: string
              inputs:
                description: List input source for Handlebars renders
                items:
                  description: inputItem describe a data input for handlebars renders
                  properties:
                    configMapRef:
                      description: The ConfigMap to select from
                      nullable: true
                      properties:
                        name:
                          description: Name of the ConfigMap
                          type: string
                        namespace:
                          description: 'Namespace of the ConfigMap, only used if the cross-namespace option is enabled (default: current object namespace)'
                          nullable: true
                          type: string
                        optional:
                          description: 'Is the ConfigMap requiered for processing ? (default: false)'
                          nullable: true
                          type: boolean
                      required:
                      - name
                      type: object
                    handleBarsRender:
                      description: an handlebars template to be rendered
                      nullable: true
                      type: string
                    name:
                      description: name of the input (used for handlebars renders)
                      type: string
                    passwordGenerator:
                      description: A password generator
                      nullable: true
                      properties:
                        length:
                          description: 'length of the password (default: 32)'
                          format: uint32
                          minimum: 0.0
                          nullable: true
                          type: integer
                        weightAlphas:
                          description: 'weight of alpha caracters (default: 60)'
                          format: uint32
                          minimum: 0.0
                          nullable: true
                          type: integer
                        weightNumbers:
                          description: 'weight of numbers caracters (default: 20)'
                          format: uint32
                          minimum: 0.0
                          nullable: true
                          type: integer
                        weightSymbols:
                          description: 'weight of symbols caracters (default: 20)'
                          format: uint32
                          minimum: 0.0
                          nullable: true
                          type: integer
                      type: object
                    secretRef:
                      description: The Secret to select from
                      nullable: true
                      properties:
                        name:
                          description: Name of the Secret
                          type: string
                        namespace:
                          description: 'Namespace of the Secret, only used if the cross-namespace option is enabled (default: current object namespace)'
                          nullable: true
                          type: string
                        optional:
                          description: 'Is the Secret optional for processing ? (default: false)'
                          nullable: true
                          type: boolean
                      required:
                      - name
                      type: object
                  required:
                  - name
                  type: object
                nullable: true
                type: array
              outputs:
                description: Objects (Secret or ConfigMap) to create at the end of the process
                items:
                  description: outputItem describe an object that will be created/updated after the path objects are all handled
                  properties:
                    data:
                      additionalProperties:
                        type: string
                      description: Data of the Output (will be base64-encoded for secret Secrets)
                      type: object
                    kind:
                      description: Either ConfigMap or Secret
                      enum:
                      - Secret
                      - ConfigMap
                      type: string
                    metadata:
                      description: 'The metadata of the Object (requiered: name)'
                      properties:
                        annotations:
                          additionalProperties:
                            type: string
                          description: annotations of the objects
                          nullable: true
                          type: object
                        labels:
                          additionalProperties:
                            type: string
                          description: labels of the objects
                          nullable: true
                          type: object
                        name:
                          description: name of the created object
                          type: string
                        namespace:
                          description: namespace of the created object
                          nullable: true
                          type: string
                      required:
                      - name
                      type: object
                    teardown:
                      description: 'Delete the Secret on RestEndPoint deletion (default: true)'
                      nullable: true
                      type: boolean
                  required:
                  - data
                  - kind
                  - metadata
                  type: object
                nullable: true
                type: array
              post:
                description: A rhai post-script for final validation if any
                nullable: true
                type: string
              pre:
                description: A rhai pre-script to setup some complex variables
                nullable: true
                type: string
              reads:
                description: Allow to read some pre-existing objects
                items:
                  description: ReadGroup describe a rest endpoint within the client sub-paths,
                  properties:
                    items:
                      description: The list of object mapping
                      items:
                        description: readGroupItem describe an object to read with the client
                        properties:
                          json_query:
                            description: Get the result from a json-query
                            nullable: true
                            type: string
                          key:
                            description: configuration of this object
                            type: string
                          name:
                            description: name of the item (used for handlebars renders)
                            type: string
                          optional:
                            description: Allow missing object (default false)
                            nullable: true
                            type: boolean
                        required:
                        - key
                        - name
                        type: object
                      type: array
                    name:
                      description: name of the write (used for handlebars renders)
                      type: string
                    path:
                      description: path appended to the client's baseurl for this group of objects
                      type: string
                    read_method:
                      description: Read verb accepted by [`RestClient::obj_read`].
                      enum:
                      - Get
                      - Post
                      nullable: true
                      type: string
                  required:
                  - items
                  - name
                  - path
                  type: object
                nullable: true
                type: array
              retryFrequency:
                description: 'retryFrequency define the pooling interval if previous try have failed (in seconds, default: 300 aka 5mn)'
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              teardown:
                description: A rhai teardown-script for a final cleanup on RestEndPoint deletion
                nullable: true
                type: string
              templates:
                description: List Handlebars templates to register
                items:
                  description: templateItem describe a list of handlebars templates that will be registered with given name
                  properties:
                    name:
                      description: name of the input (used for handlebars renders)
                      type: string
                    template:
                      description: The template to register
                      type: string
                  required:
                  - name
                  - template
                  type: object
                nullable: true
                type: array
              writes:
                description: Sub-paths to the client. Allow to describe the objects to create on the end-point
                items:
                  description: writeGroup describe a rest endpoint within the client sub-paths,
                  properties:
                    adopt:
                      description: 'Default for the items: adopt a pre-existing object instead of creating it (default: false)'
                      nullable: true
                      type: boolean
                    async:
                      description: |-
                        The API answers writes with a task to follow before the object is settled.
                        Only creates and updates are followed: a DELETE answering with a task is considered done.
                      nullable: true
                      properties:
                        done:
                          description: States meaning the task is finished successfully (e.g. `[completed]`)
                          items:
                            type: string
                          type: array
                        failed:
                          description: States meaning the task has failed (e.g. `[failed, canceled]`)
                          items:
                            type: string
                          type: array
                        resultPath:
                          description: |-
                            JSON path, in a finished task, of the reference of the created object (e.g. `$.created_resources[0]`).
                            Without it the object is found back through the item's readPath.
                          nullable: true
                          type: string
                        statePath:
                          description: JSON path of the state in the task object (e.g. `$.state`)
                          type: string
                        taskPath:
                          description: JSON path of the task reference in the response of a write (e.g. `$.task`)
                          type: string
                        timeoutSeconds:
                          description: 'Seconds after which a task still running is considered failed (default: 600)'
                          format: uint64
                          minimum: 0.0
                          nullable: true
                          type: integer
                      required:
                      - done
                      - failed
                      - statePath
                      - taskPath
                      type: object
                    childrenNoSubKey:
                      description: 'If true, updates and deletes use the same path as create and include the primary key in the payload (default: client value or false)'
                      nullable: true
                      type: boolean
                    createMethod:
                      description: Create verbs accepted by [`RestClient::obj_create`].
                      enum:
                      - Post
                      - Put
                      nullable: true
                      type: string
                    deleteMethod:
                      description: Delete verbs accepted by [`RestClient::obj_delete`].
                      enum:
                      - Delete
                      nullable: true
                      type: string
                    diff:
                      description: |-
                        How to compare the observed object with the desired values before updating it.

                        The comparison is deliberately tolerant (provisional, to be aligned with vynil-core later):
                        a desired `null` matches a missing key and `1` equals `1.0`. An observed object that cannot
                        be read (404 or an empty answer) is considered absent: with `adopt` it is created.
                      enum:
                      - None
                      - Subset
                      - Exact
                      nullable: true
                      type: string
                    items:
                      description: The list of object mapping
                      items:
                        description: writeGroupItem describe an object to maintain within
                        properties:
                          adopt:
                            description: 'Adopt a pre-existing object (found through readPath, or at `<path>/<key>`) instead of creating it. An existing object answering with an empty body is seen as absent and created (default: group value or false)'
                            nullable: true
                            type: boolean
                          diff:
                            description: |-
                              How to compare the observed object with the desired values before updating it.

                              The comparison is deliberately tolerant (provisional, to be aligned with vynil-core later):
                              a desired `null` matches a missing key and `1` equals `1.0`. An observed object that cannot
                              be read (404 or an empty answer) is considered absent: with `adopt` it is created.
                            enum:
                            - None
                            - Subset
                            - Exact
                            nullable: true
                            type: string
                          key:
                            description: 'Static key (handlebars): the object lives at `<path>/<key>`; create, update and delete use that url and no key is read from the answers'
                            nullable: true
                            type: string
                          name:
                            description: 'name of the item (used for handlebars renders: write.<group>.<name>)'
                            type: string
                          readJsonQuery:
                            description: If writes doesnt return values, (only used when readPath is specified too)
                            nullable: true
                            type: string
                          readPath:
                            description: If writes doesnt return values, use this read query to re-read
                            nullable: true
                            type: string
                          readValuesQuery:
                            description: 'JSON path applied on the observed answer before the comparison (diff). Default: the readJsonQuery result'
                            nullable: true
                            type: string
                          teardown:
                            description: 'Delete the Object on RestEndPoint deletion (default: true, inability to do so will block RestEndPoint)'
                            nullable: true
                            type: boolean
                          values:
                            description: configuration of this object (yaml format, use handlebars to generate your needed values)
                            type: string
                          valuesQuery:
                            description: |-
                              JSON path applied on the rendered values before the comparison (diff). An invalid path is an error;
                              a path matching nothing (or several values) compares the whole value, i.e. the object is updated
                            nullable: true
                            type: string
                        required:
                        - name
                        - values
                        type: object
                      type: array
                    keyIsPath:
                      description: 'If true, the key returned by the API is a full path (href) used as is, relative to the baseurl (default: client value or false)'
                      nullable: true
                      type: boolean
                    keyName:
                      description: 'keyName: the key of the object (default: id)'
                      nullable: true
                      type: string
                    keyUseSlash:
                      description: 'keyUseSlash: should the update/delete url end with a slash at the end (default: false)'
                      nullable: true
                      type: boolean
                    name:
                      description: 'name of the write (used for handlebars renders: write.<name>)'
                      type: string
                    path:
                      description: path appended to the client's baseurl for this group of objects
                      type: string
                    readMethod:
                      description: Read verb accepted by [`RestClient::obj_read`].
                      enum:
                      - Get
                      - Post
                      nullable: true
                      type: string
                    teardown:
                      description: 'Delete the Objects on RestEndPoint deletion (default: true, inability to do so will block RestEndPoint)'
                      nullable: true
                      type: boolean
                    updateMethod:
                      description: Update verbs accepted by [`RestClient::obj_update`].
                      enum:
                      - Patch
                      - Put
                      - Post
                      - None
                      nullable: true
                      type: string
                    updatePath:
                      description: Path to use to update/delete this write_group
                      nullable: true
                      type: string
                  required:
                  - items
                  - name
                  - path
                  type: object
                nullable: true
                type: array
            required:
            - client
            type: object
          status:
            description: The status object of `RestEndPoint`
            nullable: true
            properties:
              conditions:
                items:
                  description: ApplicationCondition contains details about an application condition, which is usually an error or warning
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the time the condition was last observed
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      description: Message contains human-readable message indicating details about condition
                      type: string
                    status:
                      description: Status ("True" or "False") describe if the condition is enbled
                      enum:
                      - 'True'
                      - 'False'
                      type: string
                    type:
                      description: Type is an application condition type
                      enum:
                      - Ready
                      - InputMissing
                      - InputFailed
                      - TemplateFailed
                      - InitScriptFailed
                      - PreScriptFailed
                      - PostScriptFailed
                      - TeardownScriptFailed
                      - ReadFailed
                      - ReadMissing
                      - ReReadFailed
                      - WriteFailed
                      - WritePending
                      - WriteDeleteFailed
                      - WriteAlreadyExist
                      - OutputFailed
                      - OutputDeleteFailed
                      - OutputAlreadyExist
                      type: string
                  required:
                  - message
                  - status
                  - type
                  type: object
                type: array
              generation:
                format: int64
                type: integer
              owned:
                items:
                  description: List all owned k8s objects
                  properties:
                    kind:
                      description: Either ConfigMap or Secret
                      enum:
                      - Secret
                      - ConfigMap
                      type: string
                    name:
                      description: name of the owned object
                      type: string
                    namespace:
                      description: namespace of the owned object
                      type: string
                    uid:
                      description: uid of the owned object
                      type: string
                  required:
                  - kind
                  - name
                  - namespace
                  - uid
                  type: object
                type: array
              ownedTarget:
                items:
                  description: List all owned rest objects
                  properties:
                    childrenNoSubKey:
                      description: If true, deletes include the key in the payload instead of the URL
                      nullable: true
                      type: boolean
                    group:
                      description: Object writeGroup
                      type: string
                    key:
                      description: Object key
                      type: string
                    keyIsPath:
                      description: If true, the key is a path relative to the baseurl and replaces the path
                      nullable: true
                      type: boolean
                    keyName:
                      description: 'Key field name used for payload construction (default: id)'
                      nullable: true
                      type: string
                    name:
                      description: Object name within its writeGroup
                      type: string
                    path:
                      description: Object path within the client
                      type: string
                    pendingSince:
                      description: When that task has been started (seconds since the epoch)
                      format: uint64
                      minimum: 0.0
                      nullable: true
                      type: integer
                    pendingTask:
                      description: Reference of the asynchronous task still running for this object
                      nullable: true
                      type: string
                    teardown:
                      description: should we manage this object deletion
                      type: boolean
                  required:
                  - group
                  - key
                  - name
                  - path
                  - teardown
                  type: object
                type: array
            required:
            - conditions
            - generation
            - owned
            - ownedTarget
            type: object
        required:
        - spec
        title: RestEndPoint
        type: object
    served: true
    storage: true
    subresources:
      status: {}
